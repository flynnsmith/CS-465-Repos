<div class="container">
	<div class="d-flex justify-content-between align-items-center">
		<h1>
			<a routerLink="/" class="text-decoration-none">
				{{ title }}
			</a>
		</h1>

		<nav>
			<a
				*ngIf="!auth.isLoggedIn()"
				routerLink="/login"
				class="btn btn-primary">
				Login
			</a>

			<button
				*ngIf="auth.isLoggedIn()"
				type="button"
				class="btn btn-outline-secondary"
				(click)="auth.logout()">
				Logout
			</button>
		</nav>
	</div>

	<router-outlet></router-outlet>
</div>
