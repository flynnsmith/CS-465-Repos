<div class="row mb-3">
	<div class="col-12">
		<button
			*ngIf="auth.isLoggedIn()"
			type="button"
			class="btn btn-primary"
			(click)="addTrip()">
			Add Trip
		</button>
	</div>
</div>

<div class="row">
	<div *ngFor="let trip of trips" class="col-md-4 mb-3">
		<app-trip-card [trip]="trip"></app-trip-card>
	</div>
</div>
