<div class="card h-100">
	<div class="card-header">
		{{ trip.name }}
	</div>

	<img
		src="assets/images/{{ trip.image }}"
		alt="{{ trip.name }}"
		class="card-img-top">

	<div class="card-body">
		<h6 class="card-subtitle mb-2 text-muted">
			{{ trip.resort }}
		</h6>

		<p class="card-subtitle mt-3 mb-3 text-muted">
			{{ trip.length }} only
			{{ trip.perPerson | currency:'USD':'symbol' }}
			per person
		</p>

		<p class="card-text">
			{{ trip.description }}
		</p>

		<button
			*ngIf="auth.isLoggedIn()"
			class="btn btn-info"
			(click)="editTrip()">
			Edit Trip
		</button>
	</div>
</div>
