<div class="col-md-8">
    <h2>Add Trip</h2>

    <form *ngIf="addForm"
    [formGroup]="addForm"
    (ngSubmit)="onSubmit()">

    <div class="mb-3">
        <label class="form-label">Code</label>
        <input class="form-control" formControlName="code">
    </div>

    <div class="mb-3">
        <label class="form-label">Name</label>
        <input class="form-control" formControlName="name">
    </div>

    <div class="mb-3">
        <label class="form-label">Length</label>
        <input class="form-control" formControlName="length">
    </div>

    <div class="mb-3">
        <label class="form-label">Start Date</label>
        <input type="date" class="form-control" formControlName="start">
    </div>

    <div class="mb-3">
        <label class="form-label">Resort</label>
        <input class="form-control" formControlName="resort">
    </div>

    <div class="mb-3">
        <label class="form-label">Price per Person</label>
        <input type="number" step="0.01"
        class="form-control" formControlName="perPerson">
    </div>

    <div class="mb-3">
        <label class="form-label">Image Filename</label>
        <input class="form-control" formControlName="image">
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="5"
            formControlName="description"></textarea>
    </div>

    <p *ngIf="submitted && addForm.invalid"
        class="text-danger">
        Complete all required fields and enter a valid price.
    </p>

    <p *ngIf="errorMessage" class="text-danger">
        {{ errorMessage }}
    </p>

    <button type="submit" class="btn btn-primary me-2">
        Save
    </button>

    <a routerLink="/" class="btn btn-secondary">
        Cancel
    </a>
  </form>
</div>
